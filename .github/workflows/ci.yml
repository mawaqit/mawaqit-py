name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # The codegen group too: mypy checks the generator.
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pyright
      - name: Check that the public API is fully typed
        run: uv run pyright --verifytypes mawaqit --ignoreexternal
      - run: uvx codespell
      - run: uvx yamllint --strict .
      - run: uvx zizmor --pedantic --offline .github

  test:
    name: >-
      Tests on Python ${{ matrix.python }}
      ${{ matrix.resolution == 'lowest-direct' && '(lowest dependencies)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # A dimension of its own: otherwise the include below replaces the locked
        # 3.10 job instead of adding one.
        resolution: [locked]
        include:
          - python: "3.10"
            resolution: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Install the dependencies
        env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          if [ "$RESOLUTION" = locked ]; then
            uv sync --locked
          else
            uv sync --resolution "$RESOLUTION"
          fi
      - run: uv run --no-sync pytest --cov

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel alone and use it
        run: |
          uv venv --python 3.10 /tmp/wheel
          uv pip install --python /tmp/wheel dist/*.whl
          /tmp/wheel/bin/python - <<'PY'
          import importlib.resources

          import mawaqit
          from mawaqit import AsyncMawaqitClient, MawaqitClient, hijri, prayer_times, types

          assert importlib.resources.files("mawaqit").joinpath("py.typed").is_file()
          assert MawaqitClient().mosques and AsyncMawaqitClient().auth
          assert prayer_times.prayer_day and prayer_times.next_prayer
          position = prayer_times.CalculationPosition(21.42, 39.83, "Asia/Riyadh")
          settings = prayer_times.default_calculation_settings("SA")
          options = prayer_times.CalculationOptions(year=2026)
          times = prayer_times.calculate_prayer_times(position, settings, options)
          assert times.calendar[0]["1"] == ["05:37", "06:59", "12:25", "15:29", "17:50", "19:20"]
          print("mawaqit", mawaqit.__version__, hijri.kuwaiti.__name__, types.Mosque)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
