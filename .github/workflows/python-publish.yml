name: Release

# Publishes a GitHub release to TestPyPI, then to PyPI, with trusted publishing.
# PyPI trusts this file name: renaming it breaks the publication.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yml

  build:
    name: Build the package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv build
      - name: Check that the tag is the version of the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ ! -f "dist/mawaqit-${TAG#v}-py3-none-any.whl" ]; then
            ls dist
            echo "::error::The tag $TAG is not the version of the package."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Test
      url: https://test.pypi.org/p/mawaqit
    permissions:
      id-token: write # Trusted publishing.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://pypi.org/p/mawaqit
    permissions:
      id-token: write # Trusted publishing.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
