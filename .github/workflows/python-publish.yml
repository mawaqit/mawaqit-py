name: Upload Python Package

# Publishes to the real PyPI on a published GitHub Release. Pre-releases (rc/beta/
# alpha/dev version tags) are published here too, exactly like Django/pydantic/numpy:
# `pip install` ignores them by default, so only `pip install --pre` picks them up.
# TestPyPI is intentionally NOT in this path — see publish-testpypi.yml for the
# separate, opt-in packaging rehearsal.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  Test:
    uses: ./.github/workflows/test.yml

  Check-Version-Format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check version format
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          # MAJOR.MINOR.PATCH with optional PEP 440 pre/post/dev suffixes
          # (e.g. 1.0.0, 1.2.0rc1, 2.0.0b2, 1.0.0.dev3, 1.4.1.post1).
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "Error: Version '$VERSION' is not a valid PEP 440 release (e.g. 1.0.0, 1.2.0rc1, 2.0.0.dev1)"
            exit 1
          fi
          echo "Version '$VERSION' is valid"

  Release-Build:
    runs-on: ubuntu-latest
    needs:
      - Check-Version-Format
      - Test

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  Smoke-Install:
    # Prove the built wheel installs and imports in a clean environment before
    # publishing — this is what catches a wheel missing the gitignored generated
    # code (models / sync client).
    runs-on: ubuntu-latest
    needs:
      - Release-Build
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          import mawaqit
          from mawaqit import AsyncMawaqitClient, MawaqitClient
          # Touch the generated models + both version namespaces.
          c = MawaqitClient(token='x')
          assert c.v2.mosque and c.v3.mosque
          from mawaqit._generated import v2, v3
          assert v2.Mosque and v3.Times
          print('smoke OK', mawaqit.__file__)
          "

  PyPI-Publish:
    runs-on: ubuntu-latest
    needs:
      - Release-Build
      - Smoke-Install
    permissions:
      id-token: write
    environment:
      name: Production-PyPI
      url: https://pypi.org/p/mawaqit

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
