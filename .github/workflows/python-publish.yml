name: Release

# Publishes a GitHub release to TestPyPI, then to PyPI, with trusted publishing.
# PyPI trusts this file name: renaming it breaks the publication.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yml

  build:
    name: Build the package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv build
      - name: Check that the tag is the version of the package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ ! -f "dist/mawaqit-${TAG#v}-py3-none-any.whl" ]; then
            ls dist
            echo "::error::The tag $TAG is not the version of the package."
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: Test
      url: https://test.pypi.org/p/mawaqit
    permissions:
      id-token: write # Trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://pypi.org/p/mawaqit
    permissions:
      id-token: write # Trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
