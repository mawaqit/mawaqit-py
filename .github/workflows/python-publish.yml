name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  Test:
    uses: ./.github/workflows/test.yml

  Check-Version-Regex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version format
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [[ ! $VERSION =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Error: Version '$VERSION' does not match the required format (e.g., 1.0.0, 2.1, 3.0.1.2)"
            exit 1
          fi
          echo "Version '$VERSION' is valid"

  Release-Build:
    runs-on: ubuntu-latest
    needs:
      - Check-Version-Regex
      - Test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build release distributions
        run: |
          python -m pip install build
          python -m build
        env:
          VERSION: ${{ github.event.release.tag_name }}

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  TestPyPI-Publish:
    runs-on: ubuntu-latest
    needs:
      - Release-Build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://test.pypi.org/p/mawaqit

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  PyPI-Publish:
    runs-on: ubuntu-latest
    needs:
      - Release-Build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mawaqit

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
