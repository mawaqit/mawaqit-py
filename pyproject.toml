[build-system]
# Model/sync generation runs inside the build (see hatch_build.py), so the
# generators must be available in the isolated build environment.
requires = ["hatchling", "datamodel-code-generator>=0.25", "unasync>=0.6"]
build-backend = "hatchling.build"

[project]
name = "mawaqit"
dynamic = ["version"]
description = "The official async + sync Python wrapper for the MAWAQIT API (v2 and v3)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MAWAQIT", email = "support@mawaqit.net" }]
keywords = ["mawaqit", "mosque", "prayer-times", "api", "async"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.scripts]
mawaqit-py = "mawaqit.cli:main"

[project.urls]
Homepage = "https://mawaqit.net"
Repository = "https://github.com/mawaqit/mawaqit-py"
"Bug Tracker" = "https://github.com/mawaqit/mawaqit-py/issues"

[project.optional-dependencies]
# Everything needed to (re)generate the gitignored code from the swagger specs.
codegen = [
    "datamodel-code-generator>=0.25",
    "unasync>=0.6",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "schemathesis>=3.29",
]
dev = [
    "mawaqit[codegen,test]",
    "mypy>=1.8",
    "ruff>=0.6",
    "pre-commit>=3.5",
    "build>=1.2",
]

# --------------------------------------------------------------------------- #
# Build: version + generated-code handling
# --------------------------------------------------------------------------- #
# Version comes from the VERSION env var (set to the release tag in CI, aligned
# to the newest supported API version). Falls back to 0.0.0 for local/editable
# installs. Supplied by a custom metadata hook in hatch_build.py (see the
# `version` entry in project.dynamic above).
[tool.hatch.metadata.hooks.custom]

# Custom build hook (hatch_build.py) regenerates mawaqit/_generated and
# mawaqit/_sync before the wheel/sdist is assembled.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
# src layout: the package lives at src/mawaqit but installs as ``mawaqit``.
packages = ["src/mawaqit"]
# The generated packages are gitignored, so Hatch's VCS file-discovery skips
# them. Force them into the artifact explicitly, otherwise the published wheel
# is broken on install.
artifacts = [
    "src/mawaqit/_generated/**/*.py",
    "src/mawaqit/_sync/**/*.py",
]

[tool.hatch.build.targets.sdist]
# Ship the specs + generation entrypoint so the sdist can rebuild from source.
include = [
    "src/mawaqit",
    "scripts",
    "swagger",
    "hatch_build.py",
    "README.md",
]
artifacts = [
    "src/mawaqit/_generated/**/*.py",
    "src/mawaqit/_sync/**/*.py",
]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 88
# Generated code is mechanically derived and validated by the test suite +
# pydantic at runtime; it is not gated by the linter to avoid churn.
extend-exclude = ["src/mawaqit/_generated", "src/mawaqit/_sync"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is owned by the formatter

[tool.mypy]
python_version = "3.10"
files = ["src/mawaqit"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# datamodel-code-generator output is not authored by us; its types are consumed
# strictly by the hand-written code, but the modules themselves are not gated.
module = ["mawaqit._generated.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=mawaqit --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
# Generated trees are excluded from the line-coverage gate: the async client is
# the 100%-covered source of truth, the models are validated by pydantic + the
# contract tests, and the unasync-derived sync client is verified by a dedicated
# smoke suite (test_sync.py) rather than re-hitting every mirrored line.
omit = ["src/mawaqit/_generated/*", "src/mawaqit/_sync/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload"]
