site_name: mawaqit-py
site_description: The official async + sync Python wrapper for the MAWAQIT API.
repo_url: https://github.com/mawaqit/mawaqit-py
repo_name: mawaqit/mawaqit-py

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - API reference: reference.md
  - Extending: extending.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
