# Keep the gitignored generated code fresh locally and lint the source.
# Run once with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: generate
        name: regenerate models + sync client
        entry: python scripts/generate.py
        language: python
        additional_dependencies:
          - datamodel-code-generator[ruff]>=0.25
          - unasync>=0.6
          - pyyaml
        # Rerun whenever a spec or the async source (its input) changes.
        files: ^(swagger/|src/mawaqit/_async/|scripts/generate\.py)
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
